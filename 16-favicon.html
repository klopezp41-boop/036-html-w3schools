<!DOCTYPE html>
<html lang="es">
<head>
<title>Favicon en HTML</title>
<link rel="icon" type="image/x-icon" href="https://www.w3schools.com/favicon.ico">
</head>
<body>

<h2>Agregar un favicon</h2>
<p>Un favicon es una pequeña imagen que se muestra junto al título de la página en la pestaña del navegador.</p>
<p>Se agrega con un elemento <b>&lt;link&gt;</b> dentro del <b>&lt;head&gt;</b>, después del <b>&lt;title&gt;</b>, indicando la ruta de la imagen en el atributo <b>href</b>. Un nombre común para el archivo es <b>favicon.ico</b>.</p>



</body>
</html>
