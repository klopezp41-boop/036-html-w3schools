<!DOCTYPE html>
<html lang="en">
<body>

<!-- HTML Encabezados -->
<!-- Los encabezados HTML se definen con las etiquetas <h1> a <h6>. -->
<!-- <h1> define el encabezado más importante y <h6> el menos importante. -->
<h1>Encabezado 1</h1>
<h2>Encabezado 2</h2>
<h3>Encabezado 3</h3>
<h4>Encabezado 4</h4>
<h5>Encabezado 5</h5>
<h6>Encabezado 6</h6>


<!-- Los encabezados ayudan a que los usuarios entiendan mejor de qué trata la página -->
<!-- <h1> se usa para el título principal, <h2> para secciones, <h3> para subsecciones, etc. -->
<h1>Guia de viaje</h1>

<h2>Europa</h2>
<h3>Francia</h3>
<h3>Italia</h3>

<h2>Asia</h2>
<h3>India</h3>
<h3>Tailandia</h3>

<!-- Encabezados mas Grandes -->
<!-- El tamaño de un encabezado se puede modificar con el atributo style y la propiedad CSS font-size. -->
<h1 style="font-size:60px;">Encabezado 1</h1>

</body>
</html>
